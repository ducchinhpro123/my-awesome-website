name: CI/CD Pipeline

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: my_awesome_website_test
          MYSQL_USER: webapp
          MYSQL_PASSWORD: webapp123
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json, zip

    - name: Copy .env
      run: |
        cp .env.example .env
        echo "MYSQL_HOST=127.0.0.1" >> .env
        echo "MYSQL_PORT=3306" >> .env
        echo "MYSQL_DATABASE=my_awesome_website_test" >> .env
        echo "MYSQL_USER=webapp" >> .env
        echo "MYSQL_PASSWORD=webapp123" >> .env
        echo "CLOUNDINARY_KEY=${{ secrets.CLOUNDINARY_KEY }}" >> .env
        echo "CLOUNDINARY_SECRET=${{ secrets.CLOUNDINARY_SECRET }}" >> .env
        echo "CLOUNDINARY_NAME=${{ secrets.CLOUNDINARY_NAME }}" >> .env

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run tests (if you have any)
      run: |
        # Add your test commands here
        # php vendor/bin/phpunit
        echo "Tests would run here"

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Deploy to production (example)
      run: |
        echo "Deploy to your production server here"
        # Example: SSH to server and pull new image
        # ssh user@server 'docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:master && docker-compose up -d'
